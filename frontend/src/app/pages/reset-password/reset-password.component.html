<div class="card password-card">
  <h2>Postavljanje nove lozinke</h2>

  @if (!success) {
    <div class="form-row">
      <label for="password">Nova lozinka</label>
      <input id="password" type="password" [(ngModel)]="password">
    </div>

    <div class="form-row">
      <label for="repeatedPassword">Ponovi novu lozinku</label>
      <input id="repeatedPassword" type="password" [(ngModel)]="repeatedPassword">
    </div>

    <button (click)="resetPassword()">Sačuvaj novu lozinku</button>
  }

  <p class="message" [class.success]="success">{{ message }}</p>

  @if (success) {
    <a routerLink="/">Prijavi se novom lozinkom</a>
  }
</div>
