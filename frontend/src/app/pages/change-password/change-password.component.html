<div class="card password-card">
  <h2>Promena lozinke</h2>

  @if (!success) {
    <div class="form-row">
      <label for="oldPassword">Stara lozinka</label>
      <input id="oldPassword" type="password" [(ngModel)]="oldPassword">
    </div>

    <div class="form-row">
      <label for="newPassword">Nova lozinka</label>
      <input id="newPassword" type="password" [(ngModel)]="newPassword">
    </div>

    <div class="form-row">
      <label for="repeatedPassword">Ponovi novu lozinku</label>
      <input id="repeatedPassword" type="password" [(ngModel)]="repeatedPassword">
    </div>

    <button (click)="changePassword()">Promeni lozinku</button>
    <a class="back-link" routerLink="/profile">Nazad</a>
  }

  <p class="message" [class.success]="success">{{ message }}</p>

  @if (success) {
    <p>Radi bezbednosti prijavi se ponovo. <a routerLink="/">Idi na prijavu</a></p>
  }
</div>
