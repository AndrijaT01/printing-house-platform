<div class="card password-card">
  <h2>Zaboravljena lozinka</h2>
  <p>Unesi korisničko ime ili email adresu. Link za novu lozinku važi pet minuta.</p>

  <div class="form-row">
    <label for="identifier">Korisničko ime ili email</label>
    <input id="identifier" type="text" [(ngModel)]="identifier">
  </div>

  <button (click)="requestReset()">Napravi link</button>
  <a class="back-link" routerLink="/">Nazad</a>
  <p class="message">{{ message }}</p>

  @if (resetLink != '') {
    <div class="test-link">
      <strong>Link za testiranje:</strong><br>
      <a [href]="resetLink">Postavi novu lozinku</a>
      <p>U konačnoj produkcijskoj verziji ovaj link bi se slao emailom.</p>
    </div>
  }
</div>
